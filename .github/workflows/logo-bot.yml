name: Vario Akıllı Logo & PYŞ Senkronizasyon Botu

on:
  schedule:
    # Her Pazar gece 03:00'te otomatik çalışarak yeni eklenen hisse/fon/kripto logolarını tarar ve onarır
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  sync-logos:
    runs-on: ubuntu-latest

    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Kütüphaneleri Yükle
        run: pip install -r requirements.txt

      - name: Logo Motorunu Çalıştır
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: python logo_bot.py
